name: Release
# Push a tag like v0.1.0 to build installers for Windows, macOS and Linux, attach them to a GitHub release,
# and publish the web app to GitHub Pages.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  # one draft release first: three build jobs each creating their own (at the same moment) made duplicate drafts
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the draft release
        # (the notes written for this tag, .github/release-notes/vX.Y.Z.md, come first, then GitHub's list of changes)
        run: |
          if gh release list --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' | grep -qx "$GITHUB_REF_NAME"; then
            echo "A release for $GITHUB_REF_NAME exists already"
          else
            notes=()
            [ -f ".github/release-notes/$GITHUB_REF_NAME.md" ] && notes=(--notes-file ".github/release-notes/$GITHUB_REF_NAME.md")
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "${GITHUB_REF_NAME#v}" "${notes[@]}" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  desktop:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build
      - name: Build the installers
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # uploaded with gh, not electron-builder: electron-builder skips a release that is already published (v0.2.0's,
      # published by hand from the Releases page, got no files). Uploads sometimes time out (Windows did on v0.1.0):
      # try up to three times; --clobber lets a re-run replace what an earlier attempt left.
      - name: Attach the installers to the release
        shell: bash
        run: |
          shopt -s nullglob
          files=(release/*.exe release/*.dmg release/*.zip release/*.AppImage release/*.deb release/*.blockmap release/latest*.yml)
          printf '%s\n' "${files[@]}"
          [ ${#files[@]} -gt 0 ] || { echo "No installers were built"; exit 1; }
          for i in 1 2 3; do
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber && exit 0
            echo "Attempt $i failed; trying again in 30 s"; sleep 30
          done
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npx vite build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
  # the release goes public only when every installer is on it
  publish:
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
